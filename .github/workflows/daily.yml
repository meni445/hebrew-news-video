name: Daily news video

on:
  workflow_dispatch:
  # GitHub cron is UTC (Israel = UTC+3 in summer, UTC+2 in winter) and GitHub often starts
  # scheduled runs hours late. So there are 5 tries in the evening; the first one that runs
  # makes the video and the guard job makes the later ones stop after a few seconds.
  # 19:47 UTC = 22:47 Israel summer / 21:47 winter ... last try 23:47 UTC = 02:47 / 01:47.
  schedule:
    - cron: "47 19 * * *"
    - cron: "47 20 * * *"
    - cron: "47 21 * * *"
    - cron: "47 22 * * *"
    - cron: "47 23 * * *"

# never two runs at the same time; a waiting run starts after the current one and the guard stops it
concurrency:
  group: daily-news-video
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Already published recently?
        id: check
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GUARD_HOURS: "14"
        run: |
          pip install requests
          python guard.py

  run:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core

      - name: Install avatar dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install librosa tqdm
          pip uninstall -y opencv-python opencv-contrib-python opencv-python-headless opencv-contrib-python-headless || true
          pip install "opencv-python-headless<5"
          python -c "import cv2; print('OpenCV', cv2.__version__, hasattr(cv2, 'CascadeClassifier'))"

      - name: Cache models and fonts
        uses: actions/cache@v4
        with:
          path: models
          key: models-v4-heebo-wav2lip

      - name: Collect Telegram posts
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          HOURS: "24"
        run: python collect.py

      - name: Write Hebrew script (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash,gemini-flash-latest,gemini-flash-lite-latest"
          GEMINI_RETRIES: "6"
          GEMINI_WAIT: "60"
          PROOFREAD: "2"
          TARGET_MINUTES: "5"
          MAX_STORIES: "8"
          DESC_SOURCES: "0"
          THUMB_TEXT: "1"
          NO_SLANG: "1"
          INTRO_TEMPLATE: "שלום וברוכים הבאים לחדשות היום. זהו סיכום החדשות של יום {weekday}, {date}, כל מה שחשוב לדעת מהיממה האחרונה בארץ ובעולם."
        run: python script.py

      - name: Download news media (Telegram + check)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEDIA_ENABLED: "1"
          MEDIA_SAFETY: "1"
          MEDIA_CANDIDATES: "4"
          MEDIA_PER_SEGMENT: "2"
          MEDIA_MAX_MB: "40"
          MEDIA_MAX_VIDEO_SEC: "120"
          GEMINI_SAFETY_MODEL: "gemini-flash-lite-latest,gemini-3.8-flash"
        run: python media.py

      - name: Hebrew voice (Gemini TTS, Edge fallback)
        env:
          TTS_ENGINE: "gemini"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: "gemini-3.8-flash-lite-tts,gemini-3.8-flash-tts,gemini-3.1-flash-tts-preview,gemini-2.5-flash-preview-tts"
          GEMINI_TTS_VOICE: "Charon"
          GEMINI_TTS_STYLE: ""
          TTS_VOICE: "he-IL-AvriNeural"
          TTS_PITCH: "-8Hz"
          TTS_DEEP_EQ: "0"
          TTS_NIQQUD: "0"
          TTS_PAUSE: "0.6"
          TTS_CLEAN: "1"
          TTS_SINGLE: "1"
          TTS_CHUNK_WORDS: "160"
          TTS_TAIL_GUARD: "1"
          TTS_LEVEL: "1"
          TTS_GLITCH_FIX: "1"
          TTS_PITCH_MATCH: "0"
          TTS_MAX_SEC_PER_WORD: "0.6"
        run: python tts.py

      - name: Avatar lip-sync (Wav2Lip)
        env:
          AVATAR_ENABLED: "1"
          AVATAR_IMAGE: "presenter.jpg"
          AVATAR_VIDEO: "presenter.mp4"
          AVATAR_DETECTOR: "s3fd"
          AVATAR_MOTION: "1"
          WAV2LIP_PADS: "0 15 0 0"
          WAV2LIP_MODEL: "models/wav2lip.pth"
          WAV2LIP_MODEL_URLS: "https://github.com/justinjohn0306/Wav2Lip/releases/download/models/wav2lip.pth,https://github.com/anothermartz/Easy-Wav2Lip/releases/download/Prerequesits/Wav2Lip.pth"
        run: python avatar.py

      - name: Render video
        env:
          CHANNEL_NAME: "חדשות היום"
          PRESENTER_VIDEO: "assets/presenter.mp4"
          BG_IMAGE: "background.jpg"
          TEXT_CARDS: "1"
          THUMB_V2: "1"
        run: python render.py

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_UPLOAD: "1"
          YT_PRIVACY: "public"
          YT_RICH: "1"
          CHANNEL_NAME: "חדשות היום"
        run: python upload.py

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-output
          path: daily/
          retention-days: 7
