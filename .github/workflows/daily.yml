name: Daily news video

on:
  workflow_dispatch:
  # GitHub cron is UTC: 01:00 UTC = 04:00 Israel summer time / 03:00 winter time.
  schedule:
    - cron: "0 1 * * *"

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core

      - name: Cache models and fonts
        uses: actions/cache@v4
        with:
          path: models
          key: phonikud-1.0-int8-heebo

      - name: Collect Telegram posts
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          HOURS: "24"
        run: python collect.py

      - name: Write Hebrew script (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash,gemini-flash-latest,gemini-flash-lite-latest"
          GEMINI_RETRIES: "6"
          GEMINI_WAIT: "60"
          PROOFREAD: "1"
          TARGET_MINUTES: "5"
          MAX_STORIES: "8"
        run: python script.py

      - name: Download news media (Telegram + safety check)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEDIA_ENABLED: "1"
          MEDIA_SAFETY: "1"
          MEDIA_PER_SEGMENT: "2"
          MEDIA_MAX_MB: "40"
          MEDIA_MAX_VIDEO_SEC: "120"
          GEMINI_SAFETY_MODEL: "gemini-flash-lite-latest,gemini-3.8-flash"
        run: python media.py

      - name: Hebrew voice (Gemini TTS, Edge fallback)
        env:
          TTS_ENGINE: "gemini"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: "gemini-3.8-flash-lite-tts,gemini-3.1-flash-tts"
          GEMINI_TTS_VOICE: "Zubenelgenubi"
          GEMINI_TTS_STYLE: "Read the following Hebrew news text aloud in Hebrew, exactly as written, in a friendly, warm and calm male news presenter voice, at a steady pace"
          TTS_VOICE: "he-IL-AvriNeural"
          TTS_PITCH: "-8Hz"
          TTS_DEEP_EQ: "1"
          TTS_NIQQUD: "0"
          TTS_PAUSE: "0.6"
        run: python tts.py

      - name: Render video
        env:
          CHANNEL_NAME: "חדשות היום"
          PRESENTER_VIDEO: "assets/presenter.mp4"
        run: python render.py

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_UPLOAD: "1"
          YT_PRIVACY: "private"
        run: python upload.py

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-output
          path: daily/
          retention-days: 7
